# Build copies the public files into dist/ and fingerprints asset URLs
# (see scripts/build.mjs), which is what makes the 1-year caching below safe.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"

# Security headers on every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# Fingerprinted assets: cache for a year. HTML keeps Netlify's default
# (always revalidated), so new deploys show up immediately.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
